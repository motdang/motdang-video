<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
@font-face{font-family:Kanit;font-weight:500;src:url(node_modules/@fontsource/kanit/files/kanit-thai-500-normal.woff2)}
@font-face{font-family:Kanit;font-weight:700;src:url(node_modules/@fontsource/kanit/files/kanit-thai-700-normal.woff2)}

@font-face{font-family:KanitL;font-weight:800;src:url(node_modules/@fontsource/kanit/files/kanit-latin-800-normal.woff2)}

@font-face{font-family:Plex;font-weight:600;src:url(node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-thai-600-normal.woff2)}
@font-face{font-family:PlexL;font-weight:400;src:url(node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-latin-400-normal.woff2)}
@font-face{font-family:PlexL;font-weight:600;src:url(node_modules/@fontsource/ibm-plex-sans-thai/files/ibm-plex-sans-thai-latin-600-normal.woff2)}

:root{--red:#c8352a;--red2:#a8261d;--deep:#7d1a13;--cream:#faf5ea;--paper:#f3ead6;--ink:#2a1f19;--brown:#33251c;--yellow:#f2c641;--green:#5aa86a;--mint:#bfe3c8;--sky:#a9d4f0;--blue:#3b8fd0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:KanitL,Kanit,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
[data-in]{will-change:transform,opacity}
.th{font-family:Kanit,KanitL}
.body{font-family:PlexL,Plex,sans-serif}
.mono{font-family:Mono,monospace;letter-spacing:.08em}
.card{color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:10px 12px 0 var(--ink)}
.pill{border-radius:999px}
.center{left:0;right:0;text-align:center}
.strip{position:absolute;left:0;right:0;height:26px;z-index:50;
 background:
  radial-gradient(circle at 50% 50%,var(--yellow) 0 4px,transparent 5px) 0 0/52px 26px,
  repeating-linear-gradient(90deg,var(--red) 0 26px,var(--cream) 26px 52px)}
.strip.t{top:0;border-bottom:4px solid var(--ink)} .strip.b{bottom:0;border-top:4px solid var(--ink)}
#grain{position:absolute;inset:-100px;z-index:60;pointer-events:none;opacity:.10;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .12 0 0 0 0 .08 0 0 0 1.2 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#vignette{position:absolute;inset:0;z-index:59;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,20,10,.22) 100%)}
.title{font-family:Kanit,KanitL;font-weight:800;font-size:92px;line-height:1.05;letter-spacing:-.01em}
.sub{font-family:Mono;font-weight:600;font-size:26px;letter-spacing:.16em;color:var(--red);text-transform:uppercase}
.foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-family:Mono;font-size:19px;letter-spacing:.06em;opacity:.55}
.big{font-family:KanitL,Kanit;font-weight:800}
.lantern{position:absolute;width:38px;height:48px;border-radius:12px 12px 16px 16px;background:radial-gradient(circle at 50% 60%,#ffd27a,#f2a03d 60%,#d9702a);box-shadow:0 0 30px 8px rgba(255,190,90,.45)}
.lantern:after{content:"";position:absolute;left:12px;right:12px;bottom:-6px;height:6px;background:#8f3b12;border-radius:2px}
.chip{color:var(--ink);display:inline-flex;align-items:center;gap:12px;padding:10px 24px;border:3px solid var(--ink);border-radius:999px;background:var(--cream);font-size:30px;font-weight:700;box-shadow:5px 6px 0 var(--ink)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block}
.live{display:inline-flex;align-items:center;gap:16px;background:var(--ink);color:var(--cream);padding:14px 30px;border-radius:999px;font-family:Mono;font-weight:600;font-size:26px;letter-spacing:.12em}
.live b{color:var(--yellow);font-weight:600}
.live i{width:16px;height:16px;border-radius:50%;background:#ff5a4a;display:inline-block}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- helpers ----------
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 el:x=>x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const fmt=(n,dec=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const D=window.DATA;const SLOT=D.slot;
const BAND=v=>v<=15?['#3bb2d0','ดีมาก','Very good']:v<=25?['#4caf50','ดี','Good']:v<=37.5?['#f2c641','ปานกลาง','Moderate']:v<=75?['#f08a2c','เริ่มมีผลกระทบ','Unhealthy for some']:['#d83a2a','มีผลกระทบ','Unhealthy'];
const cm=D.weather.find(c=>c.id==='chiang-mai')||D.weather[0]||{days:[]};
const cr=D.weather.find(c=>c.id==='chiang-rai')||D.weather[1]||cm;
const aCM=D.air.find(a=>a.id==='chiang-mai')||{pm25:0,hours:[]};
const aCR=D.air.find(a=>a.id==='chiang-rai')||{pm25:0,hours:[]};
const FOOT=(x)=>`<div class="foot">${x||'ข้อมูลจาก motdang.net'} · ${D.date_short}</div>`;

// ---------- illustrations ----------
const LOGO=`<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
<path pathLength="1" d="M340 194 C314 170 298 148 294 116 C292 96 306 84 320 92 C330 98 326 112 314 110" stroke-width="16"/>
<path pathLength="1" d="M380 194 C406 170 422 148 426 116 C428 96 414 84 400 92 C390 98 394 112 406 110" stroke-width="16"/>
<circle pathLength="1" cx="360" cy="222" r="34"/>
<path pathLength="1" d="M346 252 C338 262 338 270 348 274" stroke-width="14"/><path pathLength="1" d="M374 252 C382 262 382 270 372 274" stroke-width="14"/>
<ellipse pathLength="1" cx="360" cy="292" rx="26" ry="34"/><circle pathLength="1" cx="360" cy="340" r="10"/>
<path pathLength="1" d="M360 362 C398 362 418 394 418 426 C418 468 392 496 360 496 C328 496 302 468 302 426 C302 394 322 362 360 362 Z"/>
<path pathLength="1" d="M360 390 C384 398 396 418 392 442 C389 460 372 466 364 454 C358 444 368 434 376 440" stroke-width="14"/>
<path pathLength="1" d="M338 270 C304 258 276 240 258 210 C250 196 236 200 240 214 C243 225 256 222 254 212" stroke-width="16"/>
<path pathLength="1" d="M382 270 C416 258 444 240 462 210 C470 196 484 200 480 214 C477 225 464 222 466 212" stroke-width="16"/>
<path pathLength="1" d="M334 292 C292 292 258 304 234 334 C224 346 210 340 214 326 C217 316 230 316 232 326" stroke-width="16"/>
<path pathLength="1" d="M386 292 C428 292 462 304 486 334 C496 346 510 340 506 326 C503 316 490 316 488 326" stroke-width="16"/>
<path pathLength="1" d="M340 314 C302 334 280 366 272 406 C269 420 254 420 254 406 C254 396 266 392 272 400" stroke-width="16"/>
<path pathLength="1" d="M380 314 C418 334 440 366 448 406 C451 420 466 420 466 406 C466 396 454 392 448 400" stroke-width="16"/></g>`;
function badge(size,cls=''){return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 400 400">
 <circle cx="200" cy="200" r="196" fill="var(--yellow)"/><circle cx="200" cy="200" r="184" fill="var(--red)"/>
 <circle class="ring" cx="200" cy="200" r="160" fill="var(--cream)"/><circle cx="200" cy="200" r="146" fill="none" stroke="var(--red)" stroke-width="6"/>
 <g class="logo" transform="translate(200 214) scale(.6) translate(-360 -300)" stroke="var(--red)">${LOGO}</g></svg>`}
// cartoon ant mascot (faces right). legs/antennae animated in antUpdate
function ant(w,id,flip){return `<svg id="${id}" class="ant" width="${w}" height="${w*.8}" viewBox="0 0 320 256" style="overflow:visible;${flip?'transform:scaleX(-1)':''}">
<ellipse cx="160" cy="240" rx="130" ry="12" fill="rgba(40,20,10,.18)"/>
<g class="bodyg">
 <g class="legs back" stroke="#7d1a13" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <g class="leg" data-x="142" data-y="128" data-ph="0"><polyline points="142,128 112,168 98,232"/></g>
  <g class="leg" data-x="160" data-y="130" data-ph="2.1"><polyline points="160,130 160,176 148,232"/></g>
  <g class="leg" data-x="176" data-y="128" data-ph="4.2"><polyline points="176,128 206,170 218,232"/></g></g>
 <ellipse cx="78" cy="120" rx="64" ry="50" fill="#d8322a" stroke="#7d1a13" stroke-width="6"/>
 <ellipse cx="62" cy="100" rx="28" ry="14" fill="#f2695c" opacity=".8" transform="rotate(-18 62 100)"/>
 <circle cx="138" cy="120" r="13" fill="#d8322a" stroke="#7d1a13" stroke-width="6"/>
 <ellipse cx="166" cy="114" rx="30" ry="22" fill="#d8322a" stroke="#7d1a13" stroke-width="6"/>
 <g class="legs front" stroke="#7d1a13" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <g class="leg" data-x="150" data-y="130" data-ph="3.1"><polyline points="150,130 122,172 112,236"/></g>
  <g class="leg" data-x="166" data-y="132" data-ph="5.2"><polyline points="166,132 170,180 162,236"/></g>
  <g class="leg" data-x="182" data-y="130" data-ph="1.0"><polyline points="182,130 214,172 230,236"/></g></g>
 <g class="head">
  <g class="antl" stroke="#7d1a13" stroke-width="7" stroke-linecap="round" fill="none"><path d="M214 56 C206 26 214 8 232 2"/><circle cx="234" cy="2" r="8" fill="#d8322a"/></g>
  <g class="antr" stroke="#7d1a13" stroke-width="7" stroke-linecap="round" fill="none"><path d="M236 60 C246 30 262 18 280 18"/><circle cx="282" cy="18" r="8" fill="#d8322a"/></g>
  <circle cx="226" cy="92" r="44" fill="#d8322a" stroke="#7d1a13" stroke-width="6"/>
  <circle cx="244" cy="80" r="19" fill="#fff" stroke="#2a1f19" stroke-width="4"/>
  <circle class="pupil" cx="250" cy="80" r="9" fill="#2a1f19"/><circle cx="253" cy="76" r="3" fill="#fff"/>
  <path d="M244 112 Q256 120 266 108" stroke="#2a1f19" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="226" cy="110" rx="9" ry="6" fill="#f2695c" opacity=".8"/></g></g></svg>`}
function antUpdate(svg,t,walk=1){if(!svg)return;const sp=walk?11:2;
 svg.querySelectorAll('.leg').forEach(l=>{const ph=+l.dataset.ph;const a=Math.sin(t*sp+ph)*(walk?18:3);l.setAttribute('transform',`rotate(${a} ${l.dataset.x} ${l.dataset.y})`)});
 svg.querySelector('.bodyg').setAttribute('transform',`translate(0 ${walk?Math.abs(Math.sin(t*sp))*-6:Math.sin(t*2)*2})`);
 svg.querySelector('.antl').setAttribute('transform',`rotate(${Math.sin(t*5)*7} 214 56)`);
 svg.querySelector('.antr').setAttribute('transform',`rotate(${Math.sin(t*5+1)*7} 236 60)`);
 svg.querySelector('.head').setAttribute('transform',`rotate(${Math.sin(t*3)*3} 200 110)`);}

function wxIcon(kind,s){ // animated weather icon; parts animated by class in wxUpdate
 const cloud=(x,y,sc,fill='#fff')=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M30 80 a28 28 0 0 1 8-55 a40 40 0 0 1 75-10 a30 30 0 0 1 37 30 a26 26 0 0 1-5 35z" fill="${fill}" stroke="#2a1f19" stroke-width="5"/></g>`;
 const sun=(x,y,r)=>`<g class="sun" transform="translate(${x} ${y})"><g class="rays">${[...Array(10)].map((_,i)=>`<rect x="-5" y="${-r-34}" width="10" height="22" rx="5" fill="#f2a32c" transform="rotate(${i*36})"/>`).join('')}</g><circle r="${r}" fill="#ffc93c" stroke="#2a1f19" stroke-width="5"/></g>`;
 let g='';
 if(kind==='sun')g=sun(100,100,46);
 else if(kind==='partly')g=sun(70,72,36)+`<g class="cl">${cloud(40,60,.95)}</g>`;
 else if(kind==='fog')g=`<g class="cl">${cloud(25,20,1)}</g>`+[0,1,2].map(i=>`<rect class="fogl" data-i="${i}" x="30" y="${130+i*20}" width="140" height="10" rx="5" fill="#9fb3bf"/>`).join('');
 else{ g=`<g class="cl">${cloud(25,25,1,kind==='cloud'?'#fff':'#dfe7ee')}</g>`;
  if(kind==='rain'||kind==='drizzle'||kind==='storm') g+=[...Array(kind==='drizzle'?4:7)].map((_,i)=>`<line class="drop" data-i="${i}" x1="0" y1="0" x2="-6" y2="${kind==='drizzle'?12:20}" stroke="#3b8fd0" stroke-width="6" stroke-linecap="round"/>`).join('');
  if(kind==='storm') g+=`<path class="bolt" d="M105 105 L85 145 L102 145 L90 180 L128 132 L110 132 L122 105Z" fill="#ffc93c" stroke="#2a1f19" stroke-width="4"/>`;
  if(kind==='cloud') g=`<g class="cl2" opacity=".85">${cloud(70,0,.6,'#eef3f6')}</g>`+g;}
 return `<svg class="wx" data-kind="${kind}" width="${s}" height="${s}" viewBox="0 0 200 200" style="overflow:visible">${g}</svg>`}
function wxUpdate(root,t){root.querySelectorAll('.wx').forEach(svg=>{
 const r=svg.querySelector('.rays');if(r)r.setAttribute('transform',`rotate(${t*25}) scale(${1+Math.sin(t*4)*.05})`);
 svg.querySelectorAll('.cl').forEach(c=>c.setAttribute('transform',`translate(${Math.sin(t*1.3)*6} ${Math.sin(t*2)*4})`));
 svg.querySelectorAll('.cl2').forEach(c=>c.setAttribute('transform',`translate(${Math.sin(t*.9)*10} 0)`));
 svg.querySelectorAll('.drop').forEach(d=>{const i=+d.dataset.i;const ph=((t*1.6+i*.37)%1);const x=55+i*16;const y=130+ph*60;d.setAttribute('transform',`translate(${x} ${y})`);d.setAttribute('opacity',ph<.85?1:0)});
 svg.querySelectorAll('.fogl').forEach(f=>f.setAttribute('transform',`translate(${Math.sin(t*1.5+ +f.dataset.i)*14} 0)`));
 const b=svg.querySelector('.bolt');if(b)b.setAttribute('opacity',(t%1.4)<.25?1:.15);});}

function moonSVG(m,R){ // m.illum 0..1, waxing => lit right
 const f=m?m.illum:.5,wax=m?m.waxing:true,rx=R*Math.abs(1-2*f);
 const side=wax?1:0;const sweep=(f<.5)?(wax?0:1):(wax?1:0);
 const lit=`M0 ${-R} A${R} ${R} 0 0 ${side} 0 ${R} A${rx} ${R} 0 0 ${sweep} 0 ${-R}Z`;
 return `<svg width="${R*2+200}" height="${R*2+200}" viewBox="${-R-100} ${-R-100} ${R*2+200} ${R*2+200}">
 <defs><radialGradient id="mg"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient></defs>
 <circle class="glow" r="${R+95}" fill="url(#mg)"/><circle r="${R}" fill="#3a3550"/>
 <path d="${lit}" fill="#fff4cf"/>
 ${[[-.3,-.25,.16],[.25,.2,.12],[.1,-.45,.08],[-.15,.4,.1],[.45,-.1,.07]].map(([x,y,r])=>`<circle cx="${x*R}" cy="${y*R}" r="${r*R}" fill="rgba(60,50,80,.18)"/>`).join('')}
 <circle r="${R}" fill="none" stroke="#2a1f19" stroke-width="5"/></svg>`}

// ---------- scene system ----------
const scenes=[];
function scene(start,dur,html,{bg='var(--cream)',trans='none',update=null,color='var(--ink)',lanterns=0,zoom=.035}={}){
 const el=document.createElement('section');el.className='scene';el.style.background=bg;el.style.color=color;
 let lan='';seed=Math.floor(start*100)+3;
 for(let i=0;i<lanterns;i++)lan+=`<div class="lantern" data-lx="${rnd()*1000}" data-ly="${rnd()}" data-ls="${.6+rnd()*.8}" data-lv="${.5+rnd()*.7}"></div>`;
 el.innerHTML=`<div class="cam">${lan}${html}</div>`;
 document.getElementById('stage').appendChild(el);
 const s={start,dur,el,cam:el.querySelector('.cam'),trans,update,zoom,ins:[...el.querySelectorAll('[data-in]')],counts:[...el.querySelectorAll('[data-count]')],lans:[...el.querySelectorAll('.lantern')],ants:[...el.querySelectorAll('svg.ant')]};
 s.ins.forEach(e=>{e._base=e.style.transform||''});scenes.push(s);return s;}
function transClip(kind,q,seedx){ // clip for entering scene, q 0..1
 q=E.io(q);
 if(kind==='tear'){const y=H*(1-q*1.08);let pts=[`0px ${H}px`];for(let i=0;i<=24;i++){const x=i/24*W;const j=(Math.sin(i*2.7+seedx)*.5+Math.sin(i*5.3)*.5)*28;pts.push(`${x}px ${y+j}px`)}pts.push(`${W}px ${H}px`);return `polygon(${pts.join(',')})`}
 if(kind==='iris'){return `circle(${q*1250}px at 50% 46%)`}
 if(kind==='blinds'){let d='';const n=9,w=W/n;for(let i=0;i<n;i++){const k=clamp(q*1.6-i*.07);d+=`M${i*w} 0 h${w*k+.5} v${H} h${-(w*k+.5)}Z `}return `path('${d}')`}
 if(kind==='diag'){const x=q*(W+H*.6);return `polygon(0 0,${x}px 0,${x-H*.6}px ${H}px,0 ${H}px)`}
 if(kind==='up'){return `inset(${(1-q)*100}% 0 0 0)`}
 return 'none'}
function applyIn(e,lt){const a=+e.dataset.in,d=+(e.dataset.d||.7),fx=e.dataset.fx||'up';const k0=P(lt,a,a+d);
 const k=fx==='pop'?E.back(k0):E.out(k0);let tr='',op=clamp(k0*2.2);
 if(fx==='up')tr=`translateY(${(1-k)*90}px)`;else if(fx==='down')tr=`translateY(${(k-1)*90}px)`;
 else if(fx==='left')tr=`translateX(${(k-1)*260}px)`;else if(fx==='right')tr=`translateX(${(1-k)*260}px)`;
 else if(fx==='pop')tr=`scale(${Math.max(0,k)})`;else if(fx==='fade'){}
 else if(fx==='growX'){tr=`scaleX(${k})`;op=1}else if(fx==='growY'){tr=`scaleY(${k})`;op=1}
 else if(fx==='drop')tr=`translateY(${(1-E.back(k0))*-500}px) rotate(${(1-k)*-14}deg)`;
 else if(fx==='fly'){tr=`translate(${(1-k)*(+e.dataset.fx2||600)}px,${(1-k)*300}px) rotate(${(1-k)*25}deg)`}
 else if(fx==='wipe'){e.style.clipPath=`inset(-20% ${(1-k)*100}% -20% 0)`;op=1}
 const fl=+(e.dataset.float||0);if(fl&&k0>=1)tr+=` translateY(${Math.sin(lt*2+a*3)*fl}px)`;
 e.style.transform=(e._base?e._base+' ':'')+tr;e.style.opacity=op;}
function render(t){
 scenes.forEach((s,i)=>{const lt=t-s.start;const on=lt>=0&&lt<s.dur+.001;s.el.style.visibility=on?'visible':'hidden';s.el.style.zIndex=i+1;
  if(!on)return;
  s.el.style.clipPath=s.trans!=='none'&&lt<.6?transClip(s.trans,lt/.6,i):'none';
  s.cam.style.transform=`scale(${1+s.zoom*E.io(clamp(lt/s.dur))})`;
  s.ins.forEach(e=>applyIn(e,lt));
  s.counts.forEach(e=>{const a=+e.dataset.cin,d=+(e.dataset.cd||1.4),v=+e.dataset.count*E.out5(P(lt,a,a+d));e.textContent=(e.dataset.pre||'')+fmt(v,+(e.dataset.dec||0))+(e.dataset.suf||'')});
  s.lans.forEach(l=>{const v=+l.dataset.lv,ly=+l.dataset.ly,sc=+l.dataset.ls;const y=H+80-((ly*H*1.3+lt*90*v)%(H*1.3));l.style.transform=`translate(${+l.dataset.lx+Math.sin(lt*1.2+ly*9)*18}px,${y}px) scale(${sc}) rotate(${Math.sin(lt*2+ly*7)*6}deg)`;l.style.opacity=.85});
  wxUpdate(s.el,lt);
  if(s.update)s.update(lt,s);});
 const g=document.getElementById('grain');const f=Math.floor(t*12);g.style.transform=`translate(${(f*37)%100-50}px,${(f*53)%100-50}px)`;}
window.render=render;
</script>
<script src="scenes.js"></script>
</body></html>
